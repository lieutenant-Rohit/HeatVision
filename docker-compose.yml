services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heatmapper
      POSTGRES_PASSWORD: heatmapper
      POSTGRES_DB: heatmapper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: heatmapper
      DB_PASSWORD: heatmapper
      DB_NAME: heatmapper
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
